
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EagleRide BC</title>
    <meta name="description" content="A high-reliability ride-sharing platform for Boston College students, featuring intelligent matching, cost sharing, and a robust reliability scoring system." />
    <link rel="stylesheet" href="/src/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #ffffff;
        color: #000000;
        margin: 0;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        scroll-behavior: smooth;
      }
      
      * {
        backface-visibility: hidden;
      }
      
      .uber-input-container {
        position: relative;
        background-color: #F3F3F3;
        border-radius: 8px;
        display: flex;
        align-items: center;
        height: 52px;
        padding: 0 16px;
        border: 2px solid transparent;
        transition: all 0.2s ease;
      }
      
      .uber-input-container.active {
        background-color: #FFFFFF;
        border-color: #000000;
      }

      .uber-input {
        background: transparent;
        border: none;
        outline: none;
        width: 100%;
        font-size: 16px;
        font-weight: 500;
        color: #000000;
        padding-left: 12px;
      }

      .uber-input::placeholder {
        color: #6B6B6B;
        font-weight: 400;
      }

      /* Fixed Uber Line: Centered and bold */
      .uber-line {
        position: absolute;
        left: 23px;
        top: 38px;
        height: 54px;
        width: 2px;
        background-color: #000000;
        z-index: 5;
      }

      /* Minimalist scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.35);
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide {
        animation: slideIn 0.2s ease-out forwards;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
